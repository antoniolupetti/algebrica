            <text id="Removing-from-v₂-its" font-family="Geist-Regular, Geist" font-size="11" font-weight="normal" line-spacing="13" fill="#636363">
                <tspan x="2" y="11">Removing from v₂ its projection on v₁ leaves w₂ </tspan>
                <tspan x="2" y="24">orthogonal to v₁. Dividing each of the two by its </tspan>
                <tspan x="2" y="37">norm produces the orthonormal pair e₁, e₂.</tspan>
            </text>
