<svg xmlns="http://www.w3.org/2000/svg" width="320" height="264" viewBox="0 0 320 264"
     role="img" aria-labelledby="title description" font-size="12">
  <title id="title">I cinque assi di riflessione di un pentagono regolare</title>
  <desc id="description">L'asse di s, in tratto continuo, passa per v₀ e per il punto medio del lato opposto. Una rotazione antioraria di un quinto di giro porta ogni asse sul successivo. I vertici fissi sono, nell'ordine, v₀, v₁, v₂, v₃ e v₄, e gli esponenti delle riflessioni corrispondenti sono 0, 2, 4, 1 e 3 modulo 5.</desc>
  <path d="M81.06 94.35 L223.86 140.75" fill="none" stroke="#BEB8B7" stroke-dasharray="4 3"/>
  <path d="M111.21 187.15 L199.47 65.68" fill="none" stroke="#BEB8B7" stroke-dasharray="4 3"/>
  <path d="M208.79 187.15 L120.53 65.68" fill="none" stroke="#BEB8B7" stroke-dasharray="4 3"/>
  <path d="M238.94 94.35 L96.14 140.75" fill="none" stroke="#BEB8B7" stroke-dasharray="4 3"/>
  <polygon points="160.00 37.00 81.06 94.35 111.21 187.15 208.79 187.15 238.94 94.35" fill="none" stroke="#636060" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M160.00 37.00 L160.00 187.15" stroke="#312f2f" stroke-width="1.6"/>
  <path d="M135 184 v6 M185 184 v6" stroke="#312f2f"/>
  <circle cx="160.00" cy="37.00" r="2.8" fill="#312f2f"/>
  <circle cx="81.06" cy="94.35" r="2.8" fill="#312f2f"/>
  <circle cx="111.21" cy="187.15" r="2.8" fill="#312f2f"/>
  <circle cx="208.79" cy="187.15" r="2.8" fill="#312f2f"/>
  <circle cx="238.94" cy="94.35" r="2.8" fill="#312f2f"/>
  <circle cx="160.00" cy="187.15" r="2.8" fill="#312f2f"/>
  <path d="M150 27 A94 94 0 0 0 75.4 79.3" fill="none" stroke="#636060" stroke-width="1.2"/>
  <path d="m74.4 81.4 .6-8.3 5.4 2.6 z" fill="#636060"/>
  <text x="99" y="43" text-anchor="middle" fill="#312f2f"><tspan font-style="italic">r</tspan></text>
  <text x="160" y="20" text-anchor="middle" fill="#312f2f">v₀  (s)</text>
  <text x="70" y="98" text-anchor="end" fill="#312f2f">v₁  (r²s)</text>
  <text x="107" y="205" text-anchor="end" fill="#312f2f">v₂  (r⁴s)</text>
  <text x="213" y="205" text-anchor="start" fill="#312f2f">v₃  (rs)</text>
  <text x="250" y="98" text-anchor="start" fill="#312f2f">v₄  (r³s)</text>
  <text x="160" y="235" text-anchor="middle" fill="#312f2f">k ↦ k + 2  (mod 5)</text>
  <text x="160" y="255" text-anchor="middle" fill="#312f2f">0 → 2 → 4 → 1 → 3 → 0</text>
</svg>
