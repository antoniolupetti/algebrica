            <text font-size="11" font-weight="normal" line-spacing="13" fill="#636363">
                <tspan x="0" y="11">Distinct parallel lines have no </tspan>
                <tspan x="0" y="24">point in common, so the system of </tspan>
                <tspan x="0" y="37">their equations has no solution.</tspan>
            </text>
            <text font-size="11" font-weight="normal" line-spacing="13" fill="#636363">
                <tspan x="242" y="11">Coincident lines share every point, </tspan>
                <tspan x="242" y="24">and the system has infinitely </tspan>
                <tspan x="242" y="37">many solutions.</tspan>
            </text>
