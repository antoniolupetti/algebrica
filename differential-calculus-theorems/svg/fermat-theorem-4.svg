            <text font-size="12" font-weight="normal" fill="#312F2F">
                <tspan x="169" y="164">y=x³ − 3x² + 2</tspan>
            </text>
            <text font-size="12" font-weight="normal" fill="#312F2F">
                <tspan x="136" y="306">min = (2, -2)</tspan>
            </text>
