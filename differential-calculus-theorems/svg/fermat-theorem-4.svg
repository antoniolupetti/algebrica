            <text font-size="11" font-weight="normal" line-spacing="13" fill="#636060">
                <tspan x="69.5" y="11">At both local extrema, the tangent to the </tspan>
                <tspan x="69.5" y="24">curve is horizontal, as required by Fermat's </tspan>
                <tspan x="69.5" y="37">theorem. The curve changes from increasing </tspan>
                <tspan x="69.5" y="50">to decreasing at the peak and from </tspan>
                <tspan x="69.5" y="63">decreasing to increasing at the trough.</tspan>
            </text>
