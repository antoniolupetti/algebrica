            <text fill="#636060" fill-rule="nonzero" font-size="11" font-weight="normal">
                <tspan x="5" y="10">Adding the two dashed exponential halves gives the </tspan>
                <tspan x="5" y="23">hyperbolic cosine, whose lowest point is (0, 1). The curve </tspan>
                <tspan x="5" y="36">approaches each half as x tends to +∞ and -∞.</tspan>
