            <text fill="#312F2F" fill-rule="nonzero" font-size="11" font-weight="normal">
                <tspan x="216" y="116">sinh(x)</tspan>
            </text>
            <text fill="#636060" fill-rule="nonzero" font-size="11" font-weight="normal">
                <tspan x="115" y="10">Adding the two dashed exponential halves </tspan>
                <tspan x="115" y="23">gives the hyperbolic sine. It approaches </tspan>
                <tspan x="115" y="36">each of them as x tends to +∞ and -∞.</tspan>
            </text>
            <line x1="235.5" y1="45.5" x2="235.5" y2="72.5" stroke="#BEB8B7" stroke-linecap="square"></line>
        </g>
    </g>
</svg>