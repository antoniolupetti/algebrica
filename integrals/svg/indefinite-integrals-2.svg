    <title>Group</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g transform="translate(0.500000, 0.000000)">
            <text font-size="11" font-weight="normal" line-spacing="13" fill="#636060">
                <tspan x="1.5" y="11">The functions y = x², y = x² + 2, y = x² + 4 and, more generally, </tspan>
                <tspan x="1.5" y="24">all functions of the form y = x² + c differ only by a vertical </tspan>
                <tspan x="1.5" y="37">translation. Since this translation does not change the slope </tspan>
                <tspan x="1.5" y="50">of the curve, they all have the same derivative: y′ = 2x.</tspan>
            </text>
            <line x1="39" y1="60" x2="39" y2="111.5" stroke="#BEB8B7" stroke-linecap="round"></line>
            <text font-size="11" font-weight="normal" fill="#312F2F">
                <tspan x="208" y="235">y=x²</tspan>
            </text>
            <text font-size="11" font-weight="normal" fill="#312F2F">
                <tspan x="241" y="142">y=x²+2</tspan>
            </text>
            <text font-size="11" font-weight="normal" fill="#312F2F">
                <tspan x="241" y="110">y=x²+2</tspan>
            </text>
            <text font-size="11" font-weight="normal" fill="#312F2F">
                <tspan x="118" y="266">2</tspan>
            </text>
            <text font-size="11" font-weight="normal" fill="#312F2F">
                <tspan x="117" y="235">4</tspan>
            </text>
