<?xml version="1.0" encoding="UTF-8"?>
<svg width="330px" height="215px" viewBox="0 0 330 215" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Group 41</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">

        <text font-size="11" font-weight="normal" line-spacing="13" fill="#636060">
            <tspan x="24" y="11">The chord joining two points of the curve</tspan>
            <tspan x="24" y="24">generates a frustum. Its radii are the two</tspan>
            <tspan x="24" y="37">ordinates, its slant height is the chord.</tspan>
        </text>
        <line x1="50" y1="128" x2="300" y2="128" stroke="#beb8b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="4"></line>
        <path d="M92,94 L252,66 A16,62 0 0 1 252,190 L92,162 A11,34 0 0 0 92,94 Z" stroke="#312f2f" stroke-width="1" fill="#e9e3e2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M92,94 A11,34 0 0 0 92,162" stroke="#979797" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4"></path>
        <path d="M252,66 A16,62 0 0 0 252,190" stroke="#979797" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4"></path>
        <line x1="92" y1="128" x2="92" y2="94" stroke="#beb8b7" stroke-width="1" stroke-linecap="round"></line>
        <line x1="252" y1="128" x2="252" y2="66" stroke="#beb8b7" stroke-width="1" stroke-linecap="round"></line>
        <text font-size="13" font-weight="normal" fill="#312f2f"><tspan x="71" y="115">r₁</tspan></text>
        <text font-size="13" font-weight="normal" fill="#312f2f"><tspan x="267" y="96">r₂</tspan></text>
        <text font-size="13" font-weight="normal" fill="#312f2f"><tspan x="160" y="72">ℓ</tspan></text>
